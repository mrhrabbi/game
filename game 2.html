<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen – a calm memory game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#e9f1f2; --bg2:#d3e2ea; --ink:#1d3140; --muted:#56707f;
  --tile:#f6fafb; --tile-edge:#bcd0d8; --glow-l:62%; --btn:#1d3140; --btn-ink:#f6fafb;
  --serif:"Fraunces",Georgia,serif; --sans:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{ --bg1:#10202c; --bg2:#0a141d; --ink:#e4eef2; --muted:#8fa8b5;
    --tile:#1a3040; --tile-edge:#26465b; --glow-l:68%; --btn:#e4eef2; --btn-ink:#10202c; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--sans); color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  display:flex; align-items:center; justify-content:center;
  padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0);
  overflow-x:hidden;
}
/* breathing light behind the board */
body::before{
  content:""; position:fixed; left:50%; top:50%; width:90vmin; height:90vmin;
  margin:-45vmin 0 0 -45vmin; border-radius:50%; z-index:0; pointer-events:none;
  background:radial-gradient(circle,hsla(185,70%,60%,.28),transparent 65%);
  animation:breathe 9s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
main{position:relative; z-index:1; width:100%; max-width:380px; text-align:center}
h1{font-family:var(--serif); font-weight:600; font-size:2.4rem; margin:0 0 4px; letter-spacing:.01em}
.sub{margin:0 0 18px; color:var(--muted); font-size:1rem; min-height:1.5em}
.stats{display:flex; justify-content:center; gap:28px; margin-bottom:18px; color:var(--muted); font-size:.95rem}
.stats b{display:block; font-family:var(--serif); font-size:1.7rem; font-weight:400; color:var(--ink)}
.board{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:22px}
.tile{
  aspect-ratio:1; border-radius:50%; border:2px solid var(--tile-edge); background:var(--tile);
  cursor:pointer; padding:0; position:relative; transition:transform .15s, background .25s, box-shadow .25s, border-color .25s;
  -webkit-tap-highlight-color:transparent;
}
.tile:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.tile.lit{
  background:hsl(var(--h) 70% var(--glow-l)); border-color:hsl(var(--h) 70% var(--glow-l));
  box-shadow:0 0 28px 6px hsl(var(--h) 80% 60% / .55); transform:scale(1.06);
}
.tile.lit::after{
  content:""; position:absolute; inset:0; border-radius:50%; border:2px solid hsl(var(--h) 80% 65%);
  animation:ripple .7s ease-out forwards;
}
@keyframes ripple{to{transform:scale(1.6); opacity:0}}
.board.locked .tile{cursor:default}
.actions{display:flex; justify-content:center; gap:12px}
button.main{
  font:600 1rem var(--sans); background:var(--btn); color:var(--btn-ink); border:0;
  border-radius:999px; padding:12px 28px; cursor:pointer;
}
button.ghost{
  font:600 1rem var(--sans); background:transparent; color:var(--ink);
  border:2px solid var(--tile-edge); border-radius:999px; padding:10px 18px; cursor:pointer;
}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.hint{margin-top:18px; font-size:.85rem; color:var(--muted)}
@media (prefers-reduced-motion:reduce){
  body::before{animation:none} .tile.lit::after{animation:none; opacity:0} .tile{transition:none}
}
</style>
</head>
<body>
<main>
  <h1>Lumen</h1>
  <p class="sub" id="msg" aria-live="polite">Watch the lights, then play them back.</p>

  <div class="stats">
    <div><b id="level">0</b>Level</div>
    <div><b id="best">0</b>Best</div>
  </div>

  <div class="board locked" id="board" role="group" aria-label="Game board"></div>

  <div class="actions">
    <button class="main" id="start">Start</button>
    <button class="ghost" id="sound" aria-pressed="true">Sound on</button>
  </div>
  <p class="hint">Tip: breathe in while the lights play, out while you answer. Keys 1–9 also work.</p>
</main>

<script>
(function(){
  var NOTES=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99]; // pentatonic = always harmonious
  var board=document.getElementById('board'), msg=document.getElementById('msg'),
      lvlEl=document.getElementById('level'), bestEl=document.getElementById('best'),
      startBtn=document.getElementById('start'), soundBtn=document.getElementById('sound');
  var seq=[], pos=0, accepting=false, running=false, soundOn=true, best=0, ctx=null, tiles=[];

  try{ best=parseInt(localStorage.getItem('lumen-best'),10)||0; }catch(e){}
  bestEl.textContent=best;

  for(var i=0;i<9;i++){
    var t=document.createElement('button');
    t.className='tile'; t.type='button';
    t.style.setProperty('--h',150+i*17);
    t.setAttribute('aria-label','Tile '+(i+1));
    (function(n){ t.addEventListener('pointerdown',function(e){e.preventDefault(); press(n);}); })(i);
    board.appendChild(t); tiles.push(t);
  }

  function tone(n){
    if(!soundOn) return;
    try{
      ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
      var o=ctx.createOscillator(), g=ctx.createGain(), now=ctx.currentTime;
      o.type='sine'; o.frequency.value=NOTES[n];
      g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.22,now+.03);
      g.gain.exponentialRampToValueAtTime(.001,now+.9);
      o.connect(g); g.connect(ctx.destination); o.start(now); o.stop(now+.95);
    }catch(e){}
  }
  function flash(n,ms){
    var t=tiles[n]; t.classList.remove('lit'); void t.offsetWidth; t.classList.add('lit'); tone(n);
    setTimeout(function(){t.classList.remove('lit');},ms||380);
  }
  function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function setLocked(v){accepting=!v; board.classList.toggle('locked',v);}

  async function playSeq(){
    setLocked(true); msg.textContent='Watch…';
    var gap=Math.max(300,560-seq.length*14);
    await wait(600);
    for(var i=0;i<seq.length;i++){ flash(seq[i],gap*.7); await wait(gap); }
    pos=0; setLocked(false); msg.textContent='Your turn.';
  }
  function nextRound(){
    var n, last=seq[seq.length-1];
    do{ n=Math.floor(Math.random()*9); }while(n===last);
    seq.push(n); lvlEl.textContent=seq.length; playSeq();
  }
  function press(n){
    if(!running||!accepting) return;
    flash(n,260);
    if(n!==seq[pos]){ return end(); }
    pos++;
    if(pos===seq.length){
      setLocked(true); msg.textContent=['Lovely.','Nicely done.','Steady and clear.','Beautiful.'][seq.length%4];
      setTimeout(nextRound,900);
    }
  }
  function end(){
    running=false; setLocked(true);
    var reached=seq.length-1;
    if(reached>best){ best=reached; bestEl.textContent=best; try{localStorage.setItem('lumen-best',best);}catch(e){} }
    msg.textContent='That’s okay. You reached level '+Math.max(reached,0)+'. Breathe, then try again.';
    startBtn.textContent='Play again'; startBtn.disabled=false;
  }
  function start(){
    seq=[]; running=true; lvlEl.textContent=0; startBtn.disabled=true; startBtn.textContent='Playing…';
    nextRound();
  }
  startBtn.addEventListener('click',start);
  soundBtn.addEventListener('click',function(){
    soundOn=!soundOn; soundBtn.textContent=soundOn?'Sound on':'Sound off'; soundBtn.setAttribute('aria-pressed',soundOn);
  });
  document.addEventListener('keydown',function(e){
    if(e.key>='1'&&e.key<='9') press(parseInt(e.key,10)-1);
  });
})();
</script>
</body>
</html>
